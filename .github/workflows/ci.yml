name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check, test and build frontend
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Verify widget layouts at four display scales
        run: pnpm exec playwright test
      - name: Build per-user Windows installer
        run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: RVNFlow-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
