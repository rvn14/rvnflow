[package]
name = "rvnflow"
version = "0.2.0"
description = "A little space to focus. An offline Windows Pomodoro widget."
authors = ["RVNFlow contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/rvn14/rvnflow"
default-run = "RVNFlow"

[lib]
name = "rvnflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "RVNFlow"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "mp3"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_Graphics_Dwm"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
